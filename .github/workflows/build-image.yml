name: Build & deploy

# Build the Anvil image, push it to GitHub Container Registry (GHCR), then deploy it. The box never
# builds — it pulls this pre-built image.
#   main  → tags :stable (+ :latest) → deploys anvilosrs.com
#   beta  → tags :beta               → deploys beta.anvilosrs.com
#   v* tag → tags :1.2.3 + :1.2      → publishes pinned release images for self-hosters, NO deploy
# Every push also gets an immutable :sha-<full> tag, which is what the box is pinned to and what the
# health gate checks for — so "did it actually deploy" is answered by the running commit, not by an
# exit code.
#
# WHAT CHANGED, AND WHY THIS JOB WAS BROKEN. This used to POST a control plane, which recreated one
# container per clan and health-gated each in turn. There is one deployment now: clans are rows, the
# control plane is deleted, and the endpoint it called (/api/admin/rollout) has answered 404 on every
# push since — building the image fine and then failing the job with nothing deployed. So the deploy
# is now what it actually is: pull, recreate one container, wait for it to answer with the commit we
# just built, then ask the site to announce itself.

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmedfathy2001/anvil-site
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build & push (linux/amd64 — the box is an Intel i7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Two environments, one per branch: beta.anvilosrs.com from beta, anvilosrs.com from main. They
    # are separate containers against separate databases, so a beta push never touches production and
    # promoting is the same commit deploying a second time against a different one.
    #
    # Branch pushes only: a v* tag publishes pinned images for self-hosters but must not redeploy
    # anything (the commit it points at already deployed when its branch was pushed).
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # Repo secrets (Settings → Secrets and variables → Actions):
    #   SSH_HOST / SSH_USER / SSH_KEY — the box, for the pull + recreate
    #   ROLLOUT_SECRET               — matches ROLLOUT_SECRET in site.env; authorises the announce
    # The Discord webhook is NOT here on purpose. It lives in the site's own env
    # (DEPLOY_DISCORD_WEBHOOK) and the site posts its own deploy message — see
    # src/app/api/admin/deploy-notify. CI has no business holding a Discord URL.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      ROLLOUT_SECRET: ${{ secrets.ROLLOUT_SECRET }}
      # Which environment this push is. Kept in one place so the deploy, the health gate and the
      # announcement cannot disagree about which host they are talking about.
      CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'beta' || 'stable' }}
      SITE_HOST: ${{ github.ref == 'refs/heads/beta' && 'beta.anvilosrs.com' || 'anvilosrs.com' }}
      SERVICE: ${{ github.ref == 'refs/heads/beta' && 'anvil-site-beta' || 'anvil-site' }}
    steps:
      # Full history: the patch notes are the commit subjects in this push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to the box
        if: env.SSH_HOST != '' && env.SSH_USER != ''
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ahmedfathy2001/anvil-site:sha-$AFTER"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Pin this channel's tag to the exact image, then recreate only that channel's container.
          # Pulling by immutable sha tag rather than :stable is what makes a redeploy of the same
          # branch a no-op instead of a coin flip about which build the daemon has cached, and
          # --no-deps is what stops a site deploy restarting Caddy or Postgres underneath it.
          #
          # One quoted command rather than a heredoc: a heredoc terminator has to sit at column 0,
          # which cannot happen inside an indented YAML block scalar — it would run to end of file
          # and take the rest of the step with it.
          REMOTE_CMD="set -eu
          cd /opt/anvil
          docker pull '$IMAGE'
          docker tag '$IMAGE' 'anvil-site:$CHANNEL'
          docker compose up -d --no-deps '$SERVICE'"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$REMOTE_CMD"

      # The gate. A deploy is not "the command exited 0", it is "the site answers with the commit we
      # just built" — /api/version reports the GIT_SHA baked into the image at build time. Migrations
      # run at container start, so this is also waiting for those to finish.
      - name: Wait for the new build to serve
        if: env.SSH_HOST != '' && env.SSH_USER != ''
        env:
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            live=$(curl -sS --max-time 10 "https://$SITE_HOST/api/version" | jq -r '.sha // empty' || true)
            if [ "$live" = "$AFTER" ]; then
              echo "serving $live"
              exit 0
            fi
            echo "attempt $i: $SITE_HOST serving '${live:-nothing}', want $AFTER"
            sleep 5
          done
          echo "::error::$SITE_HOST never came up on $AFTER — check $SERVICE on the box"
          exit 1

      # Announce it. The site holds the webhook and writes the message; we hand over the version and
      # the notes, which are the two things only CI knows. Never fails the job: a deploy that worked
      # must not report as failed because a Discord post did not.
      - name: Announce the deploy
        if: env.ROLLOUT_SECRET != ''
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A curated RELEASE_NOTES.md if present, else the commit subjects in this push.
          if [ -f RELEASE_NOTES.md ]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            NOTES="$(git log --no-merges --format='- %s' -10)"
          else
            NOTES="$(git log --no-merges --format='- %s' "$BEFORE..$AFTER")"
          fi
          VERSION="$(git describe --tags --always)"
          # jq --arg, not interpolation: a crafted commit subject must not be able to inject here.
          BODY="$(jq -n --arg v "$VERSION" --arg n "$NOTES" --arg c "$CHANNEL" --arg s "$AFTER" \
            '{version:$v, notes:$n, channel:$c, sha:$s}')"
          curl -sS --max-time 30 -X POST \
            -H "Authorization: Bearer $ROLLOUT_SECRET" -H 'Content-Type: application/json' \
            --data "$BODY" "https://$SITE_HOST/api/admin/deploy-notify"
          echo
