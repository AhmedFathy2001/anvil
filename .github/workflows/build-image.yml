name: Build & deploy

# Build the Anvil clan-app image, push it to GitHub Container Registry (GHCR), then roll it out to
# clans on the pushed branch's release channel via the control plane's health-gated rollout endpoint.
# The box never builds — it pulls this pre-built image.
#   main  → tags :stable (+ :latest) → rolls the STABLE fleet
#   beta  → tags :beta               → rolls only the BETA canary clans
# Every push also gets an immutable :sha-<full> tag; the control plane pins each channel to that exact
# ref, which is what makes "promote beta → stable" a pointer copy (same tested artifact, no rebuild).

on:
  push:
    branches: [main, beta]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmedfathy2001/anvil-site
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=sha,format=long

      - name: Build & push (linux/amd64 — the box is an Intel i7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One-time setup — add this repo secret (Settings → Secrets and variables → Actions):
    #   ROLLOUT_SECRET — must match ROLLOUT_SECRET in admin.env on the box
    # Until ROLLOUT_SECRET is set the deploy is skipped (the build still publishes the image).
    # Deploy notifications are OWNED BY THE CONTROL PLANE (Anvil.Admin): it posts the internal ops
    # summary + the per-clan opt-in "you were updated" messages after the rollout, so no Discord
    # webhook secret lives here. We just hand it the version + patch notes below.
    env:
      ROLLOUT_SECRET: ${{ secrets.ROLLOUT_SECRET }}
    steps:
      # Need history so we can diff commit subjects for the patch notes (fetch-depth 0 = full clone).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Roll out to all active clans (sequential, health-gated)
        if: env.ROLLOUT_SECRET != ''
        # The control plane pulls the image we just pushed, then recreates each active clan one at a
        # time, health-checking each before moving on. We pass {version, notes} so it can post patch
        # notes to clans that opted in. 200 = every clan healthy; 207 = partial rollout (some clan
        # failed its health check) — fail the job so it's loud, the report body says which clan.
        # GitHub context values go through env (never inlined into the shell); notes come from git
        # log + jq --arg, so a crafted commit message can't inject into the command.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Channel + the immutable image ref the control plane pins this channel to.
          if [ "$REF" = "refs/heads/beta" ]; then CHANNEL=beta; else CHANNEL=stable; fi
          IMAGE_TAG="ghcr.io/ahmedfathy2001/anvil-site:sha-$AFTER"
          # Patch notes: a curated RELEASE_NOTES.md if present, else the commit subjects in this push.
          if [ -f RELEASE_NOTES.md ]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            NOTES="$(git log --no-merges --format='- %s' -10)"
          else
            NOTES="$(git log --no-merges --format='- %s' "$BEFORE..$AFTER")"
          fi
          VERSION="$(git rev-parse --short HEAD)"
          BODY="$(jq -n --arg v "$VERSION" --arg n "$NOTES" --arg c "$CHANNEL" --arg i "$IMAGE_TAG" \
            '{version:$v, notes:$n, channel:$c, imageTag:$i}')"
          report=$(mktemp)
          status=$(curl -sS -o "$report" -w '%{http_code}' --max-time 900 \
            -X POST -H "Authorization: Bearer $ROLLOUT_SECRET" -H 'Content-Type: application/json' \
            --data "$BODY" \
            https://anvilosrs.com/api/admin/rollout)
          echo "HTTP $status"
          cat "$report"; echo
          if [ "$status" = "200" ]; then
            echo "all clans healthy"
          elif [ "$status" = "207" ]; then
            echo "::error::partial rollout — at least one clan failed its health check (see report above)"
            exit 1
          else
            echo "::error::rollout failed (HTTP $status)"
            exit 1
          fi
