name: Build & deploy

# Build the Anvil image, push it to GitHub Container Registry (GHCR), then deploy it. The box never
# builds — it pulls this pre-built image.
#   main  → tags :stable (+ :latest) → deploys anvilosrs.com
#   beta  → tags :beta               → deploys beta.anvilosrs.com
#   v* tag → tags :1.2.3 + :1.2      → publishes pinned release images for self-hosters, NO deploy
# Every push also gets an immutable :sha-<full> tag, which is what the box is pinned to and what the
# health gate checks for — so "did it actually deploy" is answered by the running commit, not by an
# exit code.
#
# PROMOTION IS A POINTER COPY. Work lands on beta and gets built, deployed and looked at. Promoting
# is then `git push origin beta:main` — a fast-forward — and because that commit ALREADY has an
# image, this workflow retags it rather than building again. Production therefore runs the exact
# bytes beta was tested on, not a rebuild of the same source that happened to compile the same way.
#
# The build is skipped only when the sha- tag already exists. A first push to either branch builds
# normally, so nothing depends on remembering to do things in the right order.
#
# WHAT THIS REPLACED. It used to POST a control plane that recreated one container per clan and
# health-gated each in turn. There is one deployment now: clans are rows, the control plane is
# deleted, and the endpoint it called (/api/admin/rollout) answered 404 on every push for a month —
# building the image and then failing the job with nothing deployed.

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.existing.outputs.found }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Has this exact commit already been built? On a promotion it has — beta built it — so the
      # channel tag becomes a pointer to those bytes instead of a rebuild of the same source.
      - name: Look for an existing image for this commit
        id: existing
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "ghcr.io/ahmedfathy2001/anvil-site:sha-${{ github.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "this commit is already built — the channel tags will point at it"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no image for this commit yet — building"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmedfathy2001/anvil-site
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Promotion: copy the manifest to this channel's tags. No pull, no rebuild, no chance of the
      # bytes differing from what was tested.
      - name: Retag the tested image
        if: steps.existing.outputs.found == 'true'
        run: |
          set -euo pipefail
          src="ghcr.io/ahmedfathy2001/anvil-site:sha-${{ github.sha }}"
          # One imagetools call per tag the metadata step decided on, minus the sha- tag itself,
          # which already points where we want it.
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in *":sha-"*) continue ;; esac
            echo "  $tag -> $src"
            docker buildx imagetools create -t "$tag" "$src"
          done

      - name: Build & push (linux/amd64 — the box is an Intel i7)
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Two environments, one per branch: beta.anvilosrs.com from beta, anvilosrs.com from main. They
    # are separate containers against separate databases, so a beta push never touches production
    # and promoting is the same commit deploying again against a different one.
    #
    # Branch pushes only: a v* tag publishes pinned images for self-hosters but must not redeploy
    # anything (the commit it points at already deployed when its branch was pushed).
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # Repo secrets: SSH_HOST / SSH_USER / SSH_KEY.
    #
    # THE BOX OWNS THE DEPLOY, and this only asks for it. How a channel comes up is a property of
    # that machine — beta is a compose project, production is still a hand-started container — and
    # baking that in here means a box change needs a repo push to fix. /opt/anvil/deploy.sh pulls,
    # recreates, health-gates on the host answering with this exact commit, and announces to Discord
    # from the box's own webhook. Announcing there rather than here is not a preference: if the new
    # build fails to come up, the thing reporting that must not be the thing that failed.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'beta' || 'stable' }}
    steps:
      # Full history: the patch notes are the commit subjects in this push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        if: env.SSH_HOST != '' && env.SSH_USER != ''
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A curated RELEASE_NOTES.md if present, else the commit subjects in this push.
          if [ -f RELEASE_NOTES.md ]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            NOTES="$(git log --no-merges --format='- %s' -10)"
          else
            NOTES="$(git log --no-merges --format='- %s' "$BEFORE..$AFTER")"
          fi
          VERSION="$(git describe --tags --always)"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Arguments passed positionally and quoted on the remote side, so a commit subject with a
          # quote or a newline in it cannot become part of the command.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "/opt/anvil/deploy.sh $(printf %q "$CHANNEL") $(printf %q "$AFTER") $(printf %q "$VERSION") $(printf %q "$NOTES")"
