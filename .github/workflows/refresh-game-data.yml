name: Refresh game data

# Keeps the wiki-sourced catalogues current so new Jagex content flows in without a manual run:
# combat achievements, the collection log, drop tables and slayer. Each is a snapshot of the OSRS
# Wiki that a `data:*` script regenerates; left alone, the totals go stale (a new CA release, say,
# never appears until someone remembers to rebuild).
#
# Daily, because a release lands on a Wednesday and the wiki fills its pages in over the following
# days — a weekly run left new content (The Fractured Archive) missing for up to a week.
#
# It opens a PR into beta rather than pushing straight to a branch that deploys. Never into main:
# main only moves by scripts/promote.sh fast-forwarding it to what beta tested. A wiki outage or a schema
# change on their side can produce a mangled catalogue, and the one thing worse than a stale total is
# an empty one shipped automatically — so the diff gets a human glance (and the normal CI checks) on
# the way in. scripts/check-data-refresh.mjs runs first: it drops timestamp-only rewrites (else a PR
# a day for nothing) and fails the run on a catalogue that shrank. Turn on auto-merge for the PR if you want it fully hands-off.
#
# Diaries are NOT here: they're a fixed set of regions/tiers in lib/constants (Jagex adds one every
# few years), not a wiki fetch. Quests aren't here either — there is no quest catalogue yet; that
# needs building before it can be refreshed.
#
# Efficiency/rate tables are deliberately excluded too: those derive from a third-party source, and
# re-fetching them weekly would churn that dependency for no real benefit (the rates are stable).

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch CI on the PR branch (see below)

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate wiki-sourced catalogues
        run: |
          npm run data:ca
          npm run data:clog
          npm run data:drops
          npm run data:slayer

      - name: Drop timestamp-only changes, refuse shrunken catalogues
        run: node scripts/check-data-refresh.mjs

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data; then
            echo "Catalogues already current — nothing to do."
            exit 0
          fi
          echo "Changed files:"; git status --short -- src/data

          BRANCH=chore/refresh-game-data
          git config user.name "anvil-data-bot"
          git config user.email "bot@anvilosrs.com"
          git checkout -B "$BRANCH"
          git add src/data
          git commit -m "chore(data): wiki catalogue refresh"
          git push -f origin "$BRANCH"

          # One standing PR: a later run force-pushes onto it. A failed create is a real failure —
          # it used to be swallowed by `|| echo`, and every weekly run since went nowhere.
          if [ -z "$(gh pr list --head "$BRANCH" --base beta --state open --json number --jq '.[].number')" ]; then
            gh pr create --base beta --head "$BRANCH" \
              --title "chore(data): refresh CA / clog / drops / slayer catalogues" \
              --body "Automated wiki refresh of the wiki-sourced datasets (timestamp-only rewrites dropped, shrunken catalogues refused). **Review the diff** before merging."
          fi

          # A PR opened with the workflow token triggers no pull_request workflows, so run the
          # checks by hand. They report on the head commit, which is what the PR shows.
          gh workflow run ci.yml --ref "$BRANCH"
